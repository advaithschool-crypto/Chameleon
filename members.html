<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Group Members</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at 15% 20%, #d9f99d 0%, transparent 30%),
                radial-gradient(circle at 85% 20%, #a7f3d0 0%, transparent 30%),
                radial-gradient(circle at 50% 100%, #bfdbfe 0%, transparent 40%),
                linear-gradient(135deg, #f0fdf4, #ecfeff, #eff6ff);

            padding: 50px 25px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            color: #12372a;
            margin-bottom: 35px;
            letter-spacing: 2px;
        }

        /* =========================
           CAPTAIN & VICE CAPTAIN
           ========================= */

        .leaders {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 45px;
            flex-wrap: wrap;
        }

        .leader {
            width: 300px;
            padding: 25px 20px;
            border-radius: 22px;
            color: white;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .captain {
            background: linear-gradient(135deg, #ff8a00, #ff3d00);
        }

        .vice-captain {
            background: linear-gradient(135deg, #7b2ff7, #f107a3);
        }

        .leader-photo {
            width: 150px;
            height: 150px;

            object-fit: cover;
            border-radius: 50%;

            border: 5px solid white;

            margin-bottom: 18px;

            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.25);

            cursor: pointer;

            transition: transform 0.3s ease;
        }

        .leader-photo:hover {
            transform: scale(1.05);
        }

        .leader-title {
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .leader-name {
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .leader-designation {
            font-size: 16px;
            font-weight: 500;
        }

        /* =========================
           OTHER MEMBERS
           ========================= */

        .members {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .member {
            padding: 22px;
            border-radius: 18px;

            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.8);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.08);

            color: #183b2b;

            transition: 0.3s ease;
        }

        .member:hover {
            transform: translateY(-5px) scale(1.02);

            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.14);
        }

        .member-photo {
            width: 120px;
            height: 120px;

            object-fit: cover;
            border-radius: 50%;

            border: 4px solid white;

            margin-bottom: 15px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.18);

            cursor: pointer;

            transition: transform 0.3s ease;
        }

        .member-photo:hover {
            transform: scale(1.05);
        }

        .member-name {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .member-role {
            font-size: 16px;
            font-weight: 500;
            color: #39705a;
        }

        /* =========================
           BACK BUTTON
           ========================= */

        .back-button {
            margin-top: 40px;

            padding: 13px 28px;

            border: none;
            border-radius: 30px;

            background: #12372a;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.3s ease;
        }

        .back-button:hover {
            transform: scale(1.05);
            background: #1f6048;
        }

        /* =========================
           PHOTO POPUP / LIGHTBOX
           ========================= */

        .photo-popup {
            display: none;

            position: fixed;
            z-index: 9999;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.85);

            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .photo-popup.active {
            display: flex;
        }

        .popup-photo {
            max-width: 90vw;
            max-height: 85vh;

            width: auto;
            height: auto;

            object-fit: contain;

            border-radius: 15px;

            border: 4px solid white;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .close-button {
            position: absolute;

            top: 20px;
            right: 30px;

            width: 50px;
            height: 50px;

            border: none;
            border-radius: 50%;

            background: white;
            color: #12372a;

            font-size: 30px;
            font-weight: bold;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .close-button:hover {
            transform: scale(1.1);
        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            body {
                padding: 30px 15px;
            }

            h1 {
                font-size: 30px;
                margin-bottom: 25px;
            }

            .leaders {
                flex-direction: column;
                align-items: center;
                gap: 20px;
                margin-bottom: 30px;
            }

            .leader {
                width: 100%;
                max-width: 330px;
            }

            .leader-photo {
                width: 130px;
                height: 130px;
            }

            .leader-name {
                font-size: 25px;
            }

            .members {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .member {
                padding: 20px;
            }

            .member-photo {
                width: 105px;
                height: 105px;
            }

            .member-name {
                font-size: 20px;
            }

            .member-role {
                font-size: 15px;
            }

            .back-button {
                margin-bottom: 20px;
            }

            .photo-popup {
                padding: 15px;
            }

            .popup-photo {
                max-width: 95vw;
                max-height: 80vh;
                border-radius: 10px;
            }

            .close-button {
                top: 15px;
                right: 15px;

                width: 45px;
                height: 45px;

                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>OUR GROUP MEMBERS</h1>

        <!-- =========================
             CAPTAIN & VICE CAPTAIN
             ========================= -->

        <div class="leaders">

            <!-- GANESH -->

            <div class="leader captain">

                <img
                    src="ganesh.jpg"
                    alt="Ganesh"
                    class="leader-photo"
                    onclick="openPhoto(this.src)"
                >

                <div class="leader-title">
                    CAPTAIN
                </div>

                <div class="leader-name">
                    Ganesh
                </div>

                <div class="leader-designation">
                    School Vice Captain
                </div>

            </div>


            <!-- AMY -->

            <div class="leader vice-captain">

                <img
                    src="amy.jpg"
                    alt="Amy"
                    class="leader-photo"
                    onclick="openPhoto(this.src)"
                >

                <div class="leader-title">
                    VICE CAPTAIN
                </div>

                <div class="leader-name">
                    Amy
                </div>

                <div class="leader-designation">
                    Writer
                </div>

            </div>

        </div>


        <!-- =========================
             ALL OTHER MEMBERS
             ========================= -->

        <div class="members">

            <!-- ABHINESH -->

            <div class="member">

                <img
                    src="abhinesh.jpg"
                    alt="Abhinesh"
                    class="member-photo"
                    onclick="openPhoto(this.src)"
                >

                <div class="member-name">
                    Abhinesh
                </div>

                <div class="member-role">
                    District Level Athlete
                </div>

            </div>


            <!-- AMITHA -->

            <div class="member">

                <img
                    src="amitha.jpg"
                    alt="Amitha"
                    class="member-photo"
                    onclick="openPhoto(this.src)"
                >

                <div class="member-name">
                    Amitha
                </div>

                <div class="member-role">
                    E-Commerce
                </div>

            </div>


            <!-- ANOOJA -->

            <div class="member">

                <img
                    src="anooja.jpg"
                    alt="Anooja"
                    class="member-photo"
                    onclick="openPhoto(this.src)"
                >

                <div class="member-name">
                    Anooja
                </div>

                <div class="member-role">
                    Process Associate in TCS
                </div>

            </div>


            <!-- ANTO JOLLY -->

            <div class="member">

                <img
                    src="antojolly.jpg"
                    alt="Anto Jolly"
                    class="member-photo"
                    onclick="openPhoto(this.src)"
                >

                <div class="member-name">
                    Anto Jolly
                </div>

                <div class="member-role">
                    Skating & Hockey
                </div>

            </div>


            <!-- INZAM -->

            <div class="member">

                <img
                    src="inzam.jpg"
                    alt="Inzam"
                    class="member-photo"
                    onclick="openPhoto(this.src)"
                >

                <div class="member-name">
                    Inzam
                </div>

                <div class="member-role">
                    Entrepreneur
                </div>

            </div>


            <!-- ADVAITH -->

            <div class="member">

                <img
                    src="advaith.jpg"
                    alt="Advaith"
                    class="member-photo"
                    onclick="openPhoto(this.src)"
                >

                <div class="member-name">
                    Advaith
                </div>

                <div class="member-role">
                    Cricketer & Film Critic
                </div>

            </div>

        </div>


        <!-- BACK BUTTON -->

        <button
            class="back-button"
            onclick="window.location.href='index.html'">

            ← Back to Chameleon

        </button>

    </div>


    <!-- =========================
         PHOTO POPUP
         ========================= -->

    <div
        class="photo-popup"
        id="photoPopup"
        onclick="closePhoto(event)"
    >

        <button
            class="close-button"
            onclick="closePhoto()">
            ×
        </button>

        <img
            id="popupPhoto"
            class="popup-photo"
            src=""
            alt="Enlarged member photo"
        >

    </div>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>

        function openPhoto(photoSource) {

            const popup = document.getElementById("photoPopup");
            const popupPhoto = document.getElementById("popupPhoto");

            popupPhoto.src = photoSource;

            popup.classList.add("active");
        }


        function closePhoto(event) {

            if (
                !event ||
                event.target.id === "photoPopup" ||
                event.target.classList.contains("close-button")
            ) {

                const popup = document.getElementById("photoPopup");

                popup.classList.remove("active");

                document.getElementById("popupPhoto").src = "";
            }
        }


        /* Close popup with ESC key */

        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {

                document
                    .getElementById("photoPopup")
                    .classList.remove("active");

                document.getElementById("popupPhoto").src = "";
            }

        });

    </script>

</body>
</html>
