<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Group Members</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at 15% 20%, #d9f99d 0%, transparent 30%),
                radial-gradient(circle at 85% 20%, #a7f3d0 0%, transparent 30%),
                radial-gradient(circle at 50% 100%, #bfdbfe 0%, transparent 40%),
                linear-gradient(135deg, #f0fdf4, #ecfeff, #eff6ff);

            padding: 50px 25px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            color: #12372a;
            margin-bottom: 35px;
            letter-spacing: 2px;
        }

        /* =========================
           LEADERS
        ========================= */

        .leaders {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 45px;
            flex-wrap: wrap;
        }

        .leader {
            width: 280px;
            padding: 25px 20px;
            border-radius: 22px;
            color: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);

            cursor: pointer;
            transition: 0.3s ease;
        }

        .leader:hover {
            transform: translateY(-6px) scale(1.02);
        }

        .captain {
            background: linear-gradient(135deg, #ff8a00, #ff3d00);
        }

        .vice-captain {
            background: linear-gradient(135deg, #7b2ff7, #f107a3);
        }

        .leader img {
            width: 120px;
            height: 120px;

            object-fit: cover;

            border-radius: 50%;
            border: 4px solid white;

            margin-bottom: 15px;

            box-shadow: 0 5px 15px rgba(0,0,0,0.25);
        }

        .leader-title {
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .leader-name {
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .leader-designation {
            font-size: 17px;
        }


        /* =========================
           MEMBERS
        ========================= */

        .members {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .member {
            padding: 25px;
            border-radius: 18px;

            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.8);

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);

            cursor: pointer;

            transition: 0.3s ease;
        }

        .member:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.14);
        }

        .member img {
            width: 120px;
            height: 120px;

            object-fit: cover;

            border-radius: 50%;
            border: 4px solid white;

            margin-bottom: 12px;

            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .member-name {
            font-size: 22px;
            font-weight: bold;
            color: #183b2b;

            margin-bottom: 7px;
        }

        .member-designation {
            font-size: 16px;
            color: #315b48;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {
            margin-top: 40px;

            padding: 13px 28px;

            border: none;
            border-radius: 30px;

            background: #12372a;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s ease;
        }

        .back-button:hover {
            transform: scale(1.05);
            background: #1f6048;
        }


        /* =========================
           POPUP / MODAL
        ========================= */

        .modal {
            display: none;

            position: fixed;
            z-index: 9999;

            inset: 0;

            background: rgba(0, 0, 0, 0.82);

            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            position: relative;

            width: min(90vw, 500px);
            max-height: 92vh;

            overflow-y: auto;

            background: white;

            border-radius: 25px;

            padding: 25px;

            text-align: center;

            box-shadow: 0 20px 60px rgba(0,0,0,0.4);

            animation: popup 0.25s ease;
        }

        @keyframes popup {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-image {
            width: 100%;
            max-height: 65vh;

            object-fit: contain;

            border-radius: 18px;

            display: block;

            margin: auto;
        }

        .modal-name {
            margin-top: 18px;

            font-size: 30px;
            font-weight: bold;

            color: #12372a;
        }

        .modal-designation {
            margin-top: 8px;

            font-size: 19px;

            color: #315b48;
        }

        .close-button {
            position: absolute;

            top: 10px;
            right: 15px;

            width: 42px;
            height: 42px;

            border: none;
            border-radius: 50%;

            background: rgba(0,0,0,0.7);

            color: white;

            font-size: 25px;

            cursor: pointer;

            z-index: 10;
        }

        .close-button:hover {
            background: black;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 30px 15px;
            }

            h1 {
                font-size: 32px;
                margin-bottom: 28px;
            }

            .leaders {
                flex-direction: column;
                align-items: center;
            }

            .leader {
                width: 100%;
                max-width: 340px;
            }

            .members {
                grid-template-columns: 1fr;
            }

            .member {
                width: 100%;
            }

            .modal {
                padding: 12px;
            }

            .modal-content {
                width: 95vw;
                padding: 18px;
            }

            .modal-image {
                max-height: 60vh;
            }

            .modal-name {
                font-size: 25px;
            }

            .modal-designation {
                font-size: 17px;
            }
        }
    </style>
</head>


<body>

<div class="container">

    <h1>OUR GROUP MEMBERS</h1>


    <!-- =========================
         CAPTAIN & VICE CAPTAIN
    ========================= -->

    <div class="leaders">

        <div class="leader captain"
             onclick="openModal('ganesh.jpg', 'Ganesh', 'School Vice Captain')">

            <img src="ganesh.jpg" alt="Ganesh">

            <div class="leader-title">
                CAPTAIN
            </div>

            <div class="leader-name">
                Ganesh
            </div>

            <div class="leader-designation">
                School Vice Captain
            </div>

        </div>


        <div class="leader vice-captain"
             onclick="openModal('amy.jpg', 'Amy', 'Writer')">

            <img src="amy.jpg" alt="Amy">

            <div class="leader-title">
                VICE CAPTAIN
            </div>

            <div class="leader-name">
                Amy
            </div>

            <div class="leader-designation">
                Writer
            </div>

        </div>

    </div>


    <!-- =========================
         OTHER MEMBERS
    ========================= -->

    <div class="members">


        <div class="member"
             onclick="openModal('abhinesh.jpg', 'Abhinesh', 'District Level Athlete')">

            <img src="abhinesh.jpg" alt="Abhinesh">

            <div class="member-name">
                Abhinesh
            </div>

            <div class="member-designation">
                District Level Athlete
            </div>

        </div>


        <div class="member"
             onclick="openModal('amitha.jpg', 'Amitha', 'E-Commerce')">

            <img src="amitha.jpg" alt="Amitha">

            <div class="member-name">
                Amitha
            </div>

            <div class="member-designation">
                E-Commerce
            </div>

        </div>


        <div class="member"
             onclick="openModal('anooja.jpg', 'Anooja', 'Process Associate in TCS')">

            <img src="anooja.jpg" alt="Anooja">

            <div class="member-name">
                Anooja
            </div>

            <div class="member-designation">
                Process Associate in TCS
            </div>

        </div>


        <div class="member"
             onclick="openModal('antojolly.jpg', 'Anto Jolly', 'Skating & Hockey')">

            <img src="antojolly.jpg" alt="Anto Jolly">

            <div class="member-name">
                Anto Jolly
            </div>

            <div class="member-designation">
                Skating & Hockey
            </div>

        </div>


        <div class="member"
             onclick="openModal('inzam.jpg', 'Inzam', 'Entrepreneur')">

            <img src="inzam.jpg" alt="Inzam">

            <div class="member-name">
                Inzam
            </div>

            <div class="member-designation">
                Entrepreneur
            </div>

        </div>


        <div class="member"
             onclick="openModal('advaith.jpg', 'Advaith', 'Cricketer and Film Critic')">

            <img src="advaith.jpg" alt="Advaith">

            <div class="member-name">
                Advaith
            </div>

            <div class="member-designation">
                Cricketer and Film Critic
            </div>

        </div>

    </div>


    <button class="back-button"
            onclick="window.location.href='index.html'">

        ← Back to Chameleon

    </button>

</div>


<!-- =========================
     PHOTO POPUP
========================= -->

<div class="modal" id="photoModal">

    <div class="modal-content">

        <button class="close-button"
                onclick="closeModal()">

            ×

        </button>

        <img id="modalImage"
             class="modal-image"
             src=""
             alt="">

        <div id="modalName"
             class="modal-name">
        </div>

        <div id="modalDesignation"
             class="modal-designation">
        </div>

    </div>

</div>


<script>

function openModal(image, name, designation) {

    document.getElementById("modalImage").src = image;

    document.getElementById("modalName").textContent = name;

    document.getElementById("modalDesignation").textContent = designation;

    document.getElementById("photoModal").classList.add("show");

}


function closeModal() {

    document.getElementById("photoModal").classList.remove("show");

}


// Close when clicking outside the white popup

document.getElementById("photoModal").addEventListener("click", function(event) {

    if (event.target === this) {
        closeModal();
    }

});


// Close with ESC key on laptop

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        closeModal();
    }

});

</script>

</body>
</html>
