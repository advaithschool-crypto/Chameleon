<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Group Members</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at 15% 20%, #d9f99d 0%, transparent 30%),
                radial-gradient(circle at 85% 20%, #a7f3d0 0%, transparent 30%),
                radial-gradient(circle at 50% 100%, #bfdbfe 0%, transparent 40%),
                linear-gradient(135deg, #f0fdf4, #ecfeff, #eff6ff);

            padding: 50px 25px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            color: #12372a;
            margin-bottom: 35px;
            letter-spacing: 2px;
        }

        /* =========================
           CAPTAIN & VICE CAPTAIN
           ========================= */

        .leaders {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 45px;
            flex-wrap: wrap;
        }

        .leader {
            width: 300px;
            padding: 25px 20px;
            border-radius: 22px;
            color: white;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .captain {
            background: linear-gradient(135deg, #ff8a00, #ff3d00);
        }

        .vice-captain {
            background: linear-gradient(135deg, #7b2ff7, #f107a3);
        }

        /* Leader photos */

        .leader-photo {
            width: 150px;
            height: 150px;

            object-fit: cover;

            border-radius: 50%;

            border: 5px solid white;

            margin-bottom: 18px;

            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.25);
        }

        .leader-title {
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .leader-designation {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .leader-name {
            font-size: 27px;
            font-weight: bold;
        }

        /* =========================
           OTHER MEMBERS
           ========================= */

        .members {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .member {
            padding: 22px;

            border-radius: 18px;

            background: rgba(255, 255, 255, 0.65);

            backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.8);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.08);

            color: #183b2b;

            transition: 0.3s ease;
        }

        .member:hover {
            transform: translateY(-5px) scale(1.02);

            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.14);
        }

        .member-name {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .member-role {
            font-size: 16px;
            font-weight: 500;
            color: #39705a;
        }

        /* =========================
           BACK BUTTON
           ========================= */

        .back-button {
            margin-top: 40px;

            padding: 13px 28px;

            border: none;
            border-radius: 30px;

            background: #12372a;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s ease;
        }

        .back-button:hover {
            transform: scale(1.05);
            background: #1f6048;
        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            body {
                padding: 30px 15px;
            }

            h1 {
                font-size: 30px;
                margin-bottom: 25px;
            }

            .leaders {
                flex-direction: column;
                align-items: center;
                gap: 20px;
                margin-bottom: 30px;
            }

            .leader {
                width: 100%;
                max-width: 330px;
            }

            .leader-photo {
                width: 130px;
                height: 130px;
            }

            .leader-name {
                font-size: 25px;
            }

            .members {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .member {
                padding: 20px;
            }

            .member-name {
                font-size: 20px;
            }

            .member-role {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>OUR GROUP MEMBERS</h1>

        <!-- CAPTAIN & VICE CAPTAIN -->

        <div class="leaders">

            <!-- GANESH -->

            <div class="leader captain">

                    src="ganesh.jpg"

            </div>


            <!-- AMY -->

            <div class="leader vice-captain">

                <div class="leader-title">
                    VICE CAPTAIN
                </div>

                <div class="leader-name">

                </div>

                <div class="leader-designation">
                    Writer
                </div>

            </div>

        </div>


        <!-- ALL OTHER MEMBERS -->

        <div class="members">

            <div class="member">
                <div class="member-name">
                    Abhinesh
                </div>

                <div class="member-role">
                    District Level Athlete
                </div>
            </div>


            <div class="member">
                <div class="member-name">
                    Amitha
                </div>

                <div class="member-role">
                    E-Commerce
                </div>
            </div>


            <div class="member">
                <div class="member-name">
                    Anooja
                </div>

                <div class="member-role">
                    Process Associate in TCS
                </div>
            </div>


            <div class="member">
                <div class="member-name">
                    Anto Jolly
                </div>

                <div class="member-role">
                    Skating & Hockey
                </div>
            </div>


            <div class="member">
                <div class="member-name">
                    Inzam
                </div>

                <div class="member-role">
                    Entrepreneur
                </div>
            </div>


            <div class="member">
                <div class="member-name">
                    Advaith
                </div>

                <div class="member-role">
                    Cricketer & Film Critic
                </div>
            </div>

        </div>


        <!-- BACK BUTTON -->

        <button
            class="back-button"
            onclick="window.location.href='index.html'">

            ← Back to Chameleon

        </button>

    </div>

</body>
</html>
